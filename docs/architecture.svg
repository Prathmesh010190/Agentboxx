<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8b949e"/>
    </marker>
    <marker id="h" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#d29922"/>
    </marker>
  </defs>
  <rect width="900" height="300" rx="14" fill="#0d1117" stroke="#30363d"/>

  <rect x="20" y="60" width="170" height="70" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="105" y="91" fill="#e6edf3" font-size="16" font-weight="600" text-anchor="middle">Agent / Model</text>
  <text x="105" y="112" fill="#8b949e" font-size="12" text-anchor="middle">proposes commands</text>

  <rect x="250" y="60" width="190" height="70" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="345" y="91" fill="#e6edf3" font-size="16" font-weight="600" text-anchor="middle">Docker sandbox</text>
  <text x="345" y="112" fill="#8b949e" font-size="12" text-anchor="middle">no network, read-only, non-root</text>

  <rect x="500" y="60" width="170" height="70" rx="10" fill="#161b22" stroke="#bc8cff" stroke-width="2"/>
  <text x="585" y="91" fill="#e6edf3" font-size="16" font-weight="600" text-anchor="middle">Recorder</text>
  <text x="585" y="112" fill="#8b949e" font-size="12" text-anchor="middle">host-side capture</text>

  <rect x="730" y="60" width="150" height="70" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="805" y="91" fill="#e6edf3" font-size="16" font-weight="600" text-anchor="middle">Signed log</text>
  <text x="805" y="112" fill="#8b949e" font-size="12" text-anchor="middle">hash-chained .ndjson</text>

  <rect x="500" y="200" width="170" height="70" rx="10" fill="#161b22" stroke="#d29922" stroke-width="2"/>
  <text x="585" y="231" fill="#e6edf3" font-size="16" font-weight="600" text-anchor="middle">Loop detector</text>
  <text x="585" y="252" fill="#8b949e" font-size="12" text-anchor="middle">repeats, errors, no progress</text>

  <line x1="190" y1="95" x2="248" y2="95" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <text x="219" y="85" fill="#8b949e" font-size="11" text-anchor="middle">command</text>
  <line x1="440" y1="95" x2="498" y2="95" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <text x="469" y="85" fill="#8b949e" font-size="11" text-anchor="middle">output</text>
  <line x1="670" y1="95" x2="728" y2="95" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <text x="699" y="85" fill="#8b949e" font-size="11" text-anchor="middle">sign</text>
  <line x1="585" y1="130" x2="585" y2="198" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <text x="595" y="168" fill="#8b949e" font-size="11">steps</text>

  <path d="M500 235 H105 V132" fill="none" stroke="#d29922" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#h)"/>
  <text x="300" y="226" fill="#d29922" font-size="12" text-anchor="middle">[agentbox hint] fed back to the model</text>
</svg>
