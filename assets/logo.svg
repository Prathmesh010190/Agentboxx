<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Radiant Solar / Terracotta Gradient -->
    <linearGradient id="orbitalGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9500"/>
      <stop offset="60%" stop-color="#FF5100"/>
      <stop offset="100%" stop-color="#D92400"/>
    </linearGradient>

    <linearGradient id="orbitalGrad2" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF6A00"/>
      <stop offset="50%" stop-color="#FF3800"/>
      <stop offset="100%" stop-color="#B81400"/>
    </linearGradient>

    <!-- Deep Space Core -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFA24C"/>
      <stop offset="60%" stop-color="#FF5100"/>
      <stop offset="100%" stop-color="#FF5100" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft Depth Shadow -->
    <filter id="zenithShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#FF3800" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g transform="translate(100, 100)" filter="url(#zenithShadow)">
    <!-- Primary Outer Orbital Wing (Sweeping Antigravity Arc) -->
    <path d="M 0,-76
             C 45,-76 76,-42 76,2
             C 76,46 44,76 -2,76
             C -24,76 -46,66 -58,50
             C -46,58 -30,62 -12,62
             C 24,62 58,34 58,-4
             C 58,-38 30,-62 -8,-62
             C -28,-62 -48,-52 -60,-36
             C -50,-60 -24,-76 0,-76 Z"
          fill="url(#orbitalGrad1)"/>

    <!-- Counter Kinetic Wing (Interlocking Containment Vault) -->
    <path d="M 0,76
             C -45,76 -76,42 -76,-2
             C -76,-46 -44,-76 2,-76
             C 24,-76 46,-66 58,-50
             C 46,-58 30,-62 12,-62
             C -24,-62 -58,-34 -58,4
             C -58,38 -30,62 8,62
             C 28,62 48,52 60,36
             C 50,60 24,76 0,76 Z"
          fill="url(#orbitalGrad2)"/>

    <!-- Suspended Center Core (Flight Recorder Node) -->
    <circle cx="0" cy="0" r="14" fill="url(#coreGlow)"/>
    <circle cx="0" cy="0" r="7" fill="#FFFFFF"/>
  </g>
</svg>
