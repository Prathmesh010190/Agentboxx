<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Facet Gradients for Realistic 3D Depth -->
    <linearGradient id="topFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFBD59"/>
      <stop offset="100%" stop-color="#FF9500"/>
    </linearGradient>

    <linearGradient id="leftFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7300"/>
      <stop offset="100%" stop-color="#FF4500"/>
    </linearGradient>

    <linearGradient id="rightFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D63800"/>
      <stop offset="100%" stop-color="#A82500"/>
    </linearGradient>

    <filter id="cubeDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#FF4500" flood-opacity="0.30"/>
    </filter>
  </defs>

  <g transform="translate(100, 100)" filter="url(#cubeDrop)">
    <!-- 1. Left Pillar (Isometric Left Slab) -->
    <polygon points="-75,-25 -15,10 -15,80 -75,45" fill="url(#leftFace)"/>

    <!-- 2. Right Pillar (Isometric Right Slab) -->
    <polygon points="-15,10 45,-25 45,45 -15,80" fill="url(#rightFace)"/>

    <!-- 3. Top Roof Diamond (Isometric Top Deck) -->
    <polygon points="-15,-60 45,-25 -15,10 -75,-25" fill="url(#topFace)"/>

    <!-- 4. The Architectural Crossbar (Locking the 'A' and Vault) -->
    <!-- Crossbar Top -->
    <polygon points="-45,28 -15,45 15,28 -15,10" fill="#FFA533"/>
    <!-- Crossbar Front Left -->
    <polygon points="-45,28 -15,45 -15,58 -45,40" fill="#FF5E00"/>
    <!-- Crossbar Front Right -->
    <polygon points="-15,45 15,28 15,40 -15,58" fill="#B82E00"/>

    <!-- 5. Inner Negative Vault Chamber (Dark Host Core) -->
    <polygon points="-15,10 -15,45 -36,33" fill="#0D1117" opacity="0.85"/>
    <polygon points="-15,10 6,33 -15,45" fill="#05080C" opacity="0.95"/>
    <polygon points="-15,58 -15,80 -45,62" fill="#0D1117" opacity="0.6"/>
    <polygon points="-15,58 15,62 -15,80" fill="#05080C" opacity="0.7"/>

    <!-- Center Precision Telemetry Dot -->
    <circle cx="-15" cy="28" r="3.5" fill="#FFFFFF"/>
  </g>
</svg>
