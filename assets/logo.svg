<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A00"/>
      <stop offset="100%" stop-color="#FF5100"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#FF5100" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Isometric Flight Recorder Chassis -->
  <g filter="url(#dropShadow)">
    <!-- Top Face -->
    <polygon points="100,28 162,62 100,96 38,62" fill="#FFA033"/>
    <!-- Left Face -->
    <polygon points="38,62 100,96 100,166 38,132" fill="url(#boxGrad)"/>
    <!-- Right Face -->
    <polygon points="100,96 162,62 162,132 100,166" fill="#E64A00"/>
  </g>

  <!-- Central Tamper-Evident Core (Dark Shield) -->
  <polygon points="100,68 136,88 136,132 100,152 64,132 64,88" fill="url(#shieldGrad)" stroke="#38BDF8" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Flight Recorder Telemetry Beacon / Nodes -->
  <circle cx="100" cy="110" r="10" fill="url(#glowGrad)"/>
  <circle cx="100" cy="110" r="18" fill="none" stroke="#38BDF8" stroke-width="1.8" stroke-dasharray="3 3"/>

  <!-- Hash-chain connection links -->
  <line x1="100" y1="88" x2="100" y2="100" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
  <line x1="82" y1="120" x2="92" y2="114" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
  <line x1="118" y1="120" x2="108" y2="114" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>

  <circle cx="100" cy="88" r="3" fill="#38BDF8"/>
  <circle cx="82" cy="120" r="3" fill="#38BDF8"/>
  <circle cx="118" cy="120" r="3" fill="#38BDF8"/>
</svg>
