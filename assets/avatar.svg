<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="avatarBg" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#141A24"/>
      <stop offset="60%" stop-color="#0A0E15"/>
      <stop offset="100%" stop-color="#05070B"/>
    </radialGradient>

    <!-- 3D Cube Facet Gradients -->
    <linearGradient id="topF" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFBD59"/>
      <stop offset="100%" stop-color="#FF9500"/>
    </linearGradient>

    <linearGradient id="leftF" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7300"/>
      <stop offset="100%" stop-color="#FF4500"/>
    </linearGradient>

    <linearGradient id="rightF" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D63800"/>
      <stop offset="100%" stop-color="#A82500"/>
    </linearGradient>

    <!-- Deep Ambient Glow -->
    <filter id="cubeBloom" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#FF5500" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Circular Avatar Background -->
  <circle cx="256" cy="256" r="248" fill="url(#avatarBg)" stroke="#FF6600" stroke-width="6" stroke-opacity="0.35"/>

  <!-- Centered 3D Orange Box -->
  <g transform="translate(276, 256) scale(1.75)" filter="url(#cubeBloom)">
    <!-- Left Slab -->
    <polygon points="-75,-25 -15,10 -15,80 -75,45" fill="url(#leftF)"/>
    <!-- Right Slab -->
    <polygon points="-15,10 45,-25 45,45 -15,80" fill="url(#rightF)"/>
    <!-- Top Roof -->
    <polygon points="-15,-60 45,-25 -15,10 -75,-25" fill="url(#topF)"/>
    <!-- Crossbar -->
    <polygon points="-45,28 -15,45 15,28 -15,10" fill="#FFA533"/>
    <polygon points="-45,28 -15,45 -15,58 -45,40" fill="#FF5E00"/>
    <polygon points="-15,45 15,28 15,40 -15,58" fill="#B82E00"/>
    <!-- Vault Aperture -->
    <polygon points="-15,10 -15,45 -36,33" fill="#0D1117" opacity="0.85"/>
    <polygon points="-15,10 6,33 -15,45" fill="#05080C" opacity="0.95"/>
    <polygon points="-15,58 -15,80 -45,62" fill="#0D1117" opacity="0.6"/>
    <polygon points="-15,58 15,62 -15,80" fill="#05080C" opacity="0.7"/>
    <!-- Telemetry Point -->
    <circle cx="-15" cy="28" r="4.5" fill="#FFFFFF"/>
  </g>
</svg>
