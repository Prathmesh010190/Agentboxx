<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 18 800 215" width="100%" height="100%">
  <defs>
    <linearGradient id="bTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFBD59"/>
      <stop offset="100%" stop-color="#FF9500"/>
    </linearGradient>

    <linearGradient id="bLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7300"/>
      <stop offset="100%" stop-color="#FF4500"/>
    </linearGradient>

    <linearGradient id="bRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D63800"/>
      <stop offset="100%" stop-color="#A82500"/>
    </linearGradient>

    <filter id="bCubeShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#FF4500" flood-opacity="0.35"/>
    </filter>
  </defs>

  <style>
    .brand-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
      font-weight: 900;
      font-size: 44px;
      letter-spacing: 10px;
      fill: #18181B;
    }
    .brand-sub {
      font-family: 'SF Mono', 'Fira Code', 'Roboto Mono', Menlo, monospace;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 3px;
      fill: #FF6600;
    }

    @media (prefers-color-scheme: dark) {
      .brand-title { fill: #FFFFFF; }
    }
  </style>

  <g transform="translate(400, 20)" text-anchor="middle">
    <!-- 3D Boxy Cube -->
    <g transform="translate(10, 52) scale(0.68)" filter="url(#bCubeShadow)">
      <!-- Left Slab -->
      <polygon points="-75,-25 -15,10 -15,80 -75,45" fill="url(#bLeft)"/>
      <!-- Right Slab -->
      <polygon points="-15,10 45,-25 45,45 -15,80" fill="url(#bRight)"/>
      <!-- Top Roof -->
      <polygon points="-15,-60 45,-25 -15,10 -75,-25" fill="url(#bTop)"/>
      <!-- Crossbar -->
      <polygon points="-45,28 -15,45 15,28 -15,10" fill="#FFA533"/>
      <polygon points="-45,28 -15,45 -15,58 -45,40" fill="#FF5E00"/>
      <polygon points="-15,45 15,28 15,40 -15,58" fill="#B82E00"/>
      <!-- Vault Aperture -->
      <polygon points="-15,10 -15,45 -36,33" fill="#0D1117" opacity="0.85"/>
      <polygon points="-15,10 6,33 -15,45" fill="#05080C" opacity="0.95"/>
      <polygon points="-15,58 -15,80 -45,62" fill="#0D1117" opacity="0.6"/>
      <polygon points="-15,58 15,62 -15,80" fill="#05080C" opacity="0.7"/>
      <!-- Telemetry Point -->
      <circle cx="-15" cy="28" r="3.5" fill="#FFFFFF"/>
    </g>

    <!-- Unified High-Authority Typography (Pure Solid Titanium White) -->
    <text x="5" y="180" class="brand-title">AGENTBOXX</text>

    <!-- Subtitle -->
    <text x="5" y="215" class="brand-sub">TAMPER-EVIDENT AI FLIGHT RECORDER</text>
  </g>
</svg>
