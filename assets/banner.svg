<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="100%">
  <style>
    .mark-primary { fill: #E05626; }
    .mark-shadow  { fill: #C84417; }
    
    .brand-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      letter-spacing: 7px;
      fill: #18181B;
    }

    .brand-sub {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 500;
      font-size: 15px;
      letter-spacing: 1px;
      fill: #71717A;
    }

    /* GitHub Dark Mode Support */
    @media (prefers-color-scheme: dark) {
      .brand-title { fill: #F4F4F5; }
      .brand-sub   { fill: #A1A1AA; }
    }
  </style>

  <!-- Centered Layout -->
  <g transform="translate(400, 10)" text-anchor="middle">
    <!-- Anthropic-style Geometric Monogram (A + Box) -->
    <g transform="translate(-40, 0) scale(0.52)">
      <!-- Left Architectural Slab -->
      <polygon points="26,134 58,134 88,30 56,30" class="mark-primary"/>
      <!-- Right Intersecting Vault Slab -->
      <polygon points="68,76 134,76 112,134 82,134" class="mark-primary"/>
      <!-- Top Cross-Plane -->
      <polygon points="76,30 114,30 134,76 96,76" class="mark-shadow"/>
    </g>

    <!-- Editorial Typography: AGENTBOXX -->
    <text x="0" y="132" class="brand-title">AGENTBOXX</text>

    <!-- Subtitle -->
    <text x="0" y="172" class="brand-sub">A tamper-evident flight recorder for AI agents</text>
  </g>
</svg>
