<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9500"/>
      <stop offset="60%" stop-color="#FF5100"/>
      <stop offset="100%" stop-color="#D92400"/>
    </linearGradient>

    <linearGradient id="bGrad2" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF6A00"/>
      <stop offset="50%" stop-color="#FF3800"/>
      <stop offset="100%" stop-color="#B81400"/>
    </linearGradient>

    <filter id="bShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#FF3800" flood-opacity="0.32"/>
    </filter>
  </defs>

  <style>
    .brand-main {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
      font-weight: 800;
      font-size: 40px;
      letter-spacing: 7px;
      fill: #18181B;
    }
    .brand-accent {
      fill: url(#bGrad1);
    }
    .sub-brand {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 500;
      font-size: 14.5px;
      letter-spacing: 2px;
      fill: #71717A;
    }

    @media (prefers-color-scheme: dark) {
      .brand-main { fill: #FAFAFA; }
      .sub-brand  { fill: #A1A1AA; }
    }
  </style>

  <g transform="translate(400, 15)" text-anchor="middle">
    <!-- Orbital Emblem -->
    <g transform="translate(0, 52) scale(0.55)" filter="url(#bShadow)">
      <path d="M 0,-76 C 45,-76 76,-42 76,2 C 76,46 44,76 -2,76 C -24,76 -46,66 -58,50 C -46,58 -30,62 -12,62 C 24,62 58,34 58,-4 C 58,-38 30,-62 -8,-62 C -28,-62 -48,-52 -60,-36 C -50,-60 -24,-76 0,-76 Z" fill="url(#bGrad1)"/>
      <path d="M 0,76 C -45,76 -76,42 -76,-2 C -76,-46 -44,-76 2,-76 C 24,-76 46,-66 58,-50 C 46,-58 30,-62 12,-62 C -24,-62 -58,-34 -58,4 C -58,38 -30,62 8,62 C 28,62 48,52 60,36 C 50,60 24,76 0,76 Z" fill="url(#bGrad2)"/>
      <circle cx="0" cy="0" r="13" fill="#FF8A33"/>
      <circle cx="0" cy="0" r="6.5" fill="#FFFFFF"/>
    </g>

    <!-- Typography: AGENTBOXX -->
    <text x="0" y="152" class="brand-main">AGENT<tspan class="brand-accent">BOXX</tspan></text>

    <!-- Subtitle -->
    <text x="0" y="188" class="sub-brand">A TAMPER-EVIDENT FLIGHT RECORDER FOR AI AGENTS</text>
  </g>
</svg>
